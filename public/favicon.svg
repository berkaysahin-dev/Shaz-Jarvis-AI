<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="j-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a27"/>
      <stop offset="45%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>

    <!-- Metal Facets -->
    <linearGradient id="j-plat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d1d8e0"/>
      <stop offset="100%" stop-color="#778ca3"/>
    </linearGradient>

    <linearGradient id="j-titanium-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b1c2"/>
      <stop offset="100%" stop-color="#4b6584"/>
    </linearGradient>

    <linearGradient id="j-titanium-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4b6584"/>
      <stop offset="100%" stop-color="#1e272e"/>
    </linearGradient>

    <linearGradient id="j-titanium-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3436"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>

    <!-- Neon Cyan / Blue Cyber Beam -->
    <linearGradient id="j-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#0044ff"/>
    </linearGradient>

    <linearGradient id="j-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3867d6"/>
      <stop offset="45%" stop-color="#1e272e"/>
      <stop offset="100%" stop-color="#0c1017"/>
    </linearGradient>

    <filter id="j-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#j-bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#j-border)" stroke-width="3.5"/>

  <!-- Subtle Cyan Ambient Underglow -->
  <polygon points="200,120 340,120 340,360 140,360" fill="#00a8ff" opacity="0.08" filter="url(#j-glow)"/>

  <!-- === 1. TOP FLOATING CROWN DIAMOND / CREST === -->
  <!-- Top Bevel Plane -->
  <polygon points="215,125 315,125 355,165 255,165" fill="url(#j-plat)"/>
  <!-- Front Diamond Face -->
  <polygon points="255,165 355,165 315,200 215,200" fill="url(#j-cyan)"/>
  <!-- Left Chamfer -->
  <polygon points="215,125 255,165 215,200 175,160" fill="url(#j-titanium-light)"/>
  <!-- Specular top edge -->
  <line x1="215" y1="125" x2="315" y2="125" stroke="#ffffff" stroke-width="3"/>

  <!-- === 2. VERTICAL STEM OF 'J' (CHISELED PILLAR) === -->
  <!-- Left Light-Catching Facet -->
  <polygon points="235,220 275,220 275,340 235,340" fill="url(#j-titanium-light)"/>
  <!-- Center Quantum Energy Conduit -->
  <polygon points="275,220 315,220 315,340 275,340" fill="url(#j-cyan)"/>
  <line x1="295" y1="220" x2="295" y2="340" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Right Shadow Facet -->
  <polygon points="315,220 355,220 355,315 315,340" fill="url(#j-titanium-dark)"/>

  <!-- === 3. ANGULAR HOOK BASE OF 'J' === -->
  <!-- Transition Bevel -->
  <polygon points="235,340 315,340 280,395 180,395" fill="url(#j-titanium-mid)"/>
  <!-- Bottom Cross Plate -->
  <polygon points="180,395 280,395 240,430 140,430" fill="url(#j-titanium-dark)"/>
  <!-- Upward Hook Spire -->
  <polygon points="140,430 180,395 180,315 140,350" fill="url(#j-cyan)"/>
  <!-- Hook Tip Bevel -->
  <polygon points="140,350 180,315 155,295 115,330" fill="url(#j-plat)"/>
  <!-- Inner Facet -->
  <polygon points="155,295 115,330 140,430 180,395" fill="url(#j-titanium-light)"/>

  <!-- SPECULAR KNIFE-EDGES -->
  <line x1="115" y1="330" x2="155" y2="295" stroke="#ffffff" stroke-width="3"/>
  <line x1="140" y1="430" x2="240" y2="430" stroke="#00f5ff" stroke-width="3"/>
  <line x1="235" y1="220" x2="355" y2="220" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="235" y1="220" x2="235" y2="340" stroke="#ffffff" stroke-width="2"/>
</svg>